name = "mr-brij"
account_id = "6fdc4d7409114fdb5871a695028f4f30"
compatibility_date = "2026-06-12"
compatibility_flags = ["nodejs_compat"]
main = "index.ts"

# Bundle Astro SSR server modules with the worker
rules = [{ type = "ESModule", globs = ["../dist/server/**/*.mjs"], fallthrough = true }]
find_additional_modules = true

[vars]
ADMIN_EMAILS = "bps.brijendra@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "mr-brij-db"
database_id = "ca2454aa-beb6-44fb-9743-bd5b98ecb351"
migrations_dir = "../migrations"

[[kv_namespaces]]
binding = "SESSION"
id = "570795c5b59d47cc8eca483d646af691"

[images]
binding = "IMAGES"

[assets]
directory = "../dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*", "/health", "/auth", "/auth/*"]
